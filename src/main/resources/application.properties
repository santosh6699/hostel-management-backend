spring.application.name=hostel-management
server.port=${PORT:8081}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-ms=86400000
app.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
